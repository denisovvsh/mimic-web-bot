<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Mimic Web Bot</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <section>
    <details id="panel-telegram">
      <summary>Telegram</summary>
      <label>Токен бота
        <input id="telegramToken" type="password" autocomplete="off" spellcheck="false">
      </label>
      <label>ID чата уведомлений
        <input id="telegramChatId" autocomplete="off" spellcheck="false">
      </label>
    </details>
  </section>

  <section>
    <details id="panel-openrouter">
      <summary>OpenRouter</summary>
      <label>API-ключ
        <input id="openrouterKey" type="password" autocomplete="off" spellcheck="false">
      </label>
      <label>Модель чата
        <input id="chatModel" autocomplete="off" spellcheck="false">
      </label>
      <label>Модель транскрибации
        <input id="sttModel" autocomplete="off" spellcheck="false">
      </label>
      <label>Язык для транскрибации
        <input id="sttLanguage" autocomplete="off" spellcheck="false">
      </label>
    </details>
  </section>

  <div class="mode-tabs" role="tablist">
    <button type="button" class="mode-tab active" id="tab-monitor" data-mode="monitor" role="tab">
      Мониторинг <span id="monitor-indicator" class="indicator off">Выключено</span>
    </button>
    <button type="button" class="mode-tab" id="tab-telemost" data-mode="telemost" role="tab">
      Телемост <span id="rec-indicator" class="indicator off">Выключено</span>
    </button>
  </div>

  <div id="pane-monitor">
  <section>
    <h2>Мониторинг</h2>
    <div class="field" data-field="parentSelector">
      <label for="parentSelector">Селектор родителя</label>
      <div class="line">
        <input id="parentSelector" spellcheck="false">
        <button type="button" data-pick="parentSelector">Прицел</button>
      </div>
      <p class="selector-miss" data-miss="parentSelector" hidden></p>
    </div>
    <div class="field">
      <label for="itemSelector">Селектор элемента</label>
      <div class="line">
        <input id="itemSelector" spellcheck="false">
        <button type="button" data-pick="itemSelector">Прицел</button>
      </div>
      <p class="selector-miss" data-miss="itemSelector" hidden></p>
    </div>
    <div class="field">
      <label for="captchaSelector">Селектор капчи</label>
      <div class="line">
        <input id="captchaSelector" spellcheck="false">
        <button type="button" data-pick="captchaSelector">Прицел</button>
      </div>
    </div>
    <div id="features"></div>
    <button type="button" id="add-feature">Добавить признак</button>
    <label>Текст ошибки сервера
      <textarea id="errorText" rows="3"></textarea>
    </label>
    <label class="check">
      <input id="aiEnabled" type="checkbox">
      Новые карточки прогонять через ИИ
    </label>
    <label>Промпт
      <textarea id="aiPrompt" rows="4"></textarea>
    </label>
    <div class="buttons">
      <button type="button" id="monitor-start">Следить</button>
      <button type="button" id="monitor-stop">Стоп</button>
    </div>
  </section>

  <section>
    <h2>Макрос</h2>
    <div class="buttons">
      <button type="button" id="macro-rec">Записать макрос</button>
      <button type="button" id="macro-stop">Стоп записи</button>
      <button type="button" id="macro-play">Выполнить</button>
      <button type="button" id="macro-clear">Очистить</button>
    </div>
    <label class="check">
      <input id="runMacroOnNewItem" type="checkbox">
      Запускать на новый элемент
    </label>
    <ol id="macro-steps"></ol>
  </section>
  </div>

  <div id="pane-telemost" hidden>
  <section>
    <h2>Яндекс Телемост</h2>
    <p id="telemost-gate" class="hint">Откройте вкладку с адресом telemost.yandex.ru</p>
    <div class="field">
      <label for="gridSelector">Сетка участников</label>
      <div class="line">
        <input id="gridSelector" spellcheck="false">
        <button type="button" data-pick="gridSelector" disabled>Прицел</button>
      </div>
      <p class="selector-miss" data-miss="gridSelector" hidden></p>
    </div>
    <div class="field">
      <label for="tileSelector">Плитка</label>
      <div class="line">
        <input id="tileSelector" spellcheck="false">
        <button type="button" data-pick="tileSelector" disabled>Прицел</button>
      </div>
      <p class="selector-miss" data-miss="tileSelector" hidden></p>
    </div>
    <div class="field">
      <label for="speakingSelector">Признак речи</label>
      <div class="line">
        <input id="speakingSelector" spellcheck="false">
        <button type="button" data-pick="speakingSelector" disabled>Прицел</button>
      </div>
      <p class="selector-miss" data-miss="speakingSelector" hidden></p>
    </div>
    <div class="field">
      <label for="nameSelector">Имя</label>
      <div class="line">
        <input id="nameSelector" spellcheck="false">
        <button type="button" data-pick="nameSelector" disabled>Прицел</button>
      </div>
      <p class="selector-miss" data-miss="nameSelector" hidden></p>
    </div>
    <label>Свои маркеры
      <input id="localMarkers" spellcheck="false">
    </label>
    <div class="buttons">
      <button type="button" id="rec-start" disabled>Писать созвон</button>
      <button type="button" id="rec-stop" disabled>Остановить</button>
    </div>
  </section>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
